name: Build iOS Production IPA & App Store Connect

on:
  push:
    branches: [ "main", "develop", "release/**" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package iOS IPA
    runs-on: macos-15
    env:
      P12_CERTIFICATE_BASE64: ${{ secrets.P12_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Latest GA Xcode
        run: |
          LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode_*.app" | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Found and selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
            echo "DEVELOPER_DIR=$LATEST_XCODE/Contents/Developer" >> $GITHUB_ENV
          else
            echo "Falling back to /Applications/Xcode.app"
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
            echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> $GITHUB_ENV
          fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install Pillow for Asset Generation
        run: pip3 install Pillow --break-system-packages

      - name: Compile iOS Production Binary (arm64 Device)
        run: |
          # Altere o caminho abaixo para a pasta do seu projeto iOS
          PROJECT_DIR="ios/RapidoCarPlayer"
          if [ ! -d "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find ios -maxdepth 2 -name "Info.plist" | head -n 1 | xargs dirname)
          fi
          cd "$PROJECT_DIR"
          
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          APP_NAME=$(basename "$PWD")
          
          mkdir -p "build/device/Payload/${APP_NAME}.app"
          
          SWIFT_FILES=$(find Sources -name "*.swift")
          
          echo "Compiling for arm64 physical device (iOS 16.0+ deployment target)..."
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.0 \
            -sdk $SDK_PATH \
            -emit-executable \
            -O \
            -o "build/device/Payload/${APP_NAME}.app/${APP_NAME}" \
            $SWIFT_FILES
            
          cp Info.plist "build/device/Payload/${APP_NAME}.app/"
          echo "APPL????" > "build/device/Payload/${APP_NAME}.app/PkgInfo"
          
          if [ -d "Resources" ]; then
            echo "Copying application resources..."
            cp -r Resources/* "build/device/Payload/${APP_NAME}.app/"
          fi

          if [ -f "Resources/client_launcher.png" ] || [ -f "Resources/AppIcon.png" ]; then
            echo "Generating 100% RGB Icons without Alpha channel (App Store compliant)..."
            ICON_SRC=$(find Resources -name "*.png" | head -n 1)
            python3 -c "
            from PIL import Image
            
            def create_icon(src_path, dst_path, size):
                im = Image.open(src_path)
                bg = Image.new('RGB', (size, size), (18, 20, 24))
                if im.mode in ('RGBA', 'LA') or (im.mode == 'P' and 'transparency' in im.info):
                    im_rgba = im.convert('RGBA')
                    im_resized = im_rgba.resize((size, size), Image.Resampling.LANCZOS)
                    bg.paste(im_resized, (0, 0), im_resized)
                else:
                    im_resized = im.convert('RGB').resize((size, size), Image.Resampling.LANCZOS)
                    bg.paste(im_resized, (0, 0))
                bg.convert('RGB').save(dst_path, 'PNG', optimize=True)

            create_icon('$ICON_SRC', 'Assets.xcassets/AppIcon.appiconset/icon_120.png', 120)
            create_icon('$ICON_SRC', 'Assets.xcassets/AppIcon.appiconset/icon_180.png', 180)
            create_icon('$ICON_SRC', 'Assets.xcassets/AppIcon.appiconset/icon_152.png', 152)
            create_icon('$ICON_SRC', 'Assets.xcassets/AppIcon.appiconset/icon_167.png', 167)
            create_icon('$ICON_SRC', 'Assets.xcassets/AppIcon.appiconset/icon_1024.png', 1024)
            "
            
            cp Assets.xcassets/AppIcon.appiconset/icon_120.png "build/device/Payload/${APP_NAME}.app/AppIcon60x60@2x.png"
            cp Assets.xcassets/AppIcon.appiconset/icon_180.png "build/device/Payload/${APP_NAME}.app/AppIcon60x60@3x.png"
            cp Assets.xcassets/AppIcon.appiconset/icon_152.png "build/device/Payload/${APP_NAME}.app/AppIcon76x76@2x~ipad.png"
            cp Assets.xcassets/AppIcon.appiconset/icon_167.png "build/device/Payload/${APP_NAME}.app/AppIcon83.5x83.5@2x~ipad.png"
            cp Assets.xcassets/AppIcon.appiconset/icon_1024.png "build/device/Payload/${APP_NAME}.app/iTunesArtwork@2x.png"
          fi

          if [ -d "Assets.xcassets" ]; then
            echo "Compiling Asset Catalog with actool..."
            xcrun actool --output-format human-readable-text \
              --notices --warnings \
              --output-partial-info-plist build/assetcatalog_generated_info.plist \
              --app-icon AppIcon \
              --compress-pngs \
              --enable-on-demand-resources NO \
              --target-device iphone --target-device ipad \
              --minimum-deployment-target 16.0 \
              --platform iphoneos \
              --compile "build/device/Payload/${APP_NAME}.app" \
              Assets.xcassets
            
            if [ -f "build/assetcatalog_generated_info.plist" ]; then
              /usr/libexec/PlistBuddy -x -c "Merge build/assetcatalog_generated_info.plist" "build/device/Payload/${APP_NAME}.app/Info.plist" || true
            fi
          fi

          PLIST_PATH="build/device/Payload/${APP_NAME}.app/Info.plist"
          SYS_BLD=$(sw_vers -buildVersion)
          
          # Read genuine metadata dynamically from active Xcode and iOS SDK
          XCODE_INFO="$DEVELOPER_DIR/../Info.plist"
          ACT_DTXCODE=$(/usr/libexec/PlistBuddy -c "Print :DTXcode" "$XCODE_INFO" 2>/dev/null || echo "")
          ACT_DTXCODEBUILD=$(/usr/libexec/PlistBuddy -c "Print :DTXcodeBuild" "$XCODE_INFO" 2>/dev/null || echo "")
          ACT_SDKVER=$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo "")
          ACT_SDKBLD=$(xcrun --sdk iphoneos --show-sdk-build-version 2>/dev/null || echo "")
          
          if [ -n "$ACT_DTXCODE" ]; then
            /usr/libexec/PlistBuddy -c "Set :DTXcode $ACT_DTXCODE" $PLIST_PATH || /usr/libexec/PlistBuddy -c "Add :DTXcode string $ACT_DTXCODE" $PLIST_PATH
          fi
          if [ -n "$ACT_DTXCODEBUILD" ]; then
            /usr/libexec/PlistBuddy -c "Set :DTXcodeBuild $ACT_DTXCODEBUILD" $PLIST_PATH || /usr/libexec/PlistBuddy -c "Add :DTXcodeBuild string $ACT_DTXCODEBUILD" $PLIST_PATH
          fi
          if [ -n "$ACT_SDKVER" ]; then
            /usr/libexec/PlistBuddy -c "Set :DTSDKName iphoneos$ACT_SDKVER" $PLIST_PATH || /usr/libexec/PlistBuddy -c "Add :DTSDKName string iphoneos$ACT_SDKVER" $PLIST_PATH
            /usr/libexec/PlistBuddy -c "Set :DTPlatformVersion $ACT_SDKVER" $PLIST_PATH || /usr/libexec/PlistBuddy -c "Add :DTPlatformVersion string $ACT_SDKVER" $PLIST_PATH
          fi
          if [ -n "$ACT_SDKBLD" ]; then
            /usr/libexec/PlistBuddy -c "Set :DTSDKBuild $ACT_SDKBLD" $PLIST_PATH || /usr/libexec/PlistBuddy -c "Add :DTSDKBuild string $ACT_SDKBLD" $PLIST_PATH
            /usr/libexec/PlistBuddy -c "Set :DTPlatformBuild $ACT_SDKBLD" $PLIST_PATH || /usr/libexec/PlistBuddy -c "Add :DTPlatformBuild string $ACT_SDKBLD" $PLIST_PATH
          fi
          /usr/libexec/PlistBuddy -c "Set :DTCompiler com.apple.compilers.llvm.clang.1_0" $PLIST_PATH || /usr/libexec/PlistBuddy -c "Add :DTCompiler string com.apple.compilers.llvm.clang.1_0" $PLIST_PATH
          /usr/libexec/PlistBuddy -c "Set :BuildMachineOSBuild $SYS_BLD" $PLIST_PATH || /usr/libexec/PlistBuddy -c "Add :BuildMachineOSBuild string $SYS_BLD" $PLIST_PATH

          echo "Verifying arm64 Device Mach-O Binary..."
          file "build/device/Payload/${APP_NAME}.app/${APP_NAME}"
          otool -l "build/device/Payload/${APP_NAME}.app/${APP_NAME}" | grep -A 5 "LC_BUILD_VERSION" || true
          
          echo "Packaging initial IPA file..."
          cd build/device
          zip -y -r -q "../${APP_NAME}.ipa" Payload
          cd ../../..

      - name: Install Apple Certificate & Provisioning Profile
        if: env.P12_CERTIFICATE_BASE64 != '' && env.PROVISIONING_PROFILE_BASE64 != ''
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD="temporary-keychain-pass"
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          echo "$P12_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          
          openssl pkcs12 -in $RUNNER_TEMP/certificate.p12 -nodes -passin "pass:$P12_PASSWORD" -out $RUNNER_TEMP/temp_cert.pem
          openssl pkcs12 -export -in $RUNNER_TEMP/temp_cert.pem -out $RUNNER_TEMP/legacy_cert.p12 -passout "pass:$P12_PASSWORD"

          security import $RUNNER_TEMP/legacy_cert.p12 -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

          PROJECT_DIR="ios/RapidoCarPlayer"
          if [ ! -d "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find ios -maxdepth 2 -name "Info.plist" | head -n 1 | xargs dirname)
          fi
          APP_NAME=$(basename "$PROJECT_DIR")
          
          cd "$PROJECT_DIR/build/device"
          cp ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision "Payload/${APP_NAME}.app/embedded.mobileprovision"
          
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision > profile.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' profile.plist > entitlements.plist
          
          codesign --force --sign "Apple Distribution" --keychain $KEYCHAIN_PATH --entitlements entitlements.plist --generate-entitlement-der "Payload/${APP_NAME}.app"
          
          rm -f "../${APP_NAME}.ipa"
          zip -y -r -q "../${APP_NAME}.ipa" Payload
          cd ../../../

      - name: Upload to App Store Connect / TestFlight
        if: env.APP_STORE_CONNECT_PRIVATE_KEY != '' && env.APP_STORE_CONNECT_KEY_ID != ''
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys ~/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          
          IPA_FILE=$(find ios -name "*.ipa" | head -n 1)
          echo "Uploading $IPA_FILE to App Store Connect..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload Production IPA as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppStore-IPA
          path: ios/**/*.ipa
